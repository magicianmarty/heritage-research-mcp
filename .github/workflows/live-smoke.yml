name: Live smoke

# Makes one small real request to each source, to catch an upstream API changing under us.
# Keyless sources always run. Keyed sources run only if the matching repository secret is set.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DPLA_API_KEY: ${{ secrets.DPLA_API_KEY }}
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
      HERITAGE_MCP_CONTACT: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check every configured source
        run: heritage-research-mcp doctor --live
