[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heritage-research-mcp"
version = "0.1.1"
description = "MCP server for historical research: Internet Archive, Wikimedia Commons, DPLA, the National Archives Catalog and Smithsonian Open Access, with rights metadata on every record"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "magicianmarty" }]
keywords = ["mcp", "research", "history", "archives", "internet-archive", "wikimedia-commons", "dpla", "nara", "smithsonian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.urls]
Homepage = "https://github.com/magicianmarty/heritage-research-mcp"
Issues = "https://github.com/magicianmarty/heritage-research-mcp/issues"

[project.scripts]
heritage-research-mcp = "heritage_research_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heritage_research_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
